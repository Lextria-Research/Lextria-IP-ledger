<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lextria IP Dashboard</title>
<link rel="icon" href="/static/img/lextria-logo.png">
<link id="font-link" rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link id="app-style-link" rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="app" id="app-root"></div>
<div id="modal-root"></div>
<div id="gate-root"></div>
<div id="backend-key-root"></div>
<div id="toast-root" class="toast-stack"></div>

<!-- Seed ledger, used only when neither the backend nor localStorage has saved state yet. -->
<script id="app-state" type="application/json">{"clients": [], "records": [], "nextClientSeq": 1, "nextRecordSeq": 1, "log": []}</script>

<!-- defer: runs after the DOM is parsed, so the app's init() still finds #app-state
     and its mount points, exactly as it did when this script was inline at the end of body. -->
<script id="app-script" src="/static/js/app.js" defer></script>

</body>
</html>
