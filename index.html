<title>Lextria IP Dashboard</title>
<link id="font-link" rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="app-style">
  :root {
    color-scheme: light;
    --bg: #f5f4f8;
    --surface: #ffffff;
    --surface-2: #edeaf4;
    --border: #dfdce9;
    --border-strong: #c7c3d7;
    --ink: #1b1a24;
    --ink-secondary: #5b5868;
    --ink-muted: #8a8798;
    --accent: #463ea0;
    --accent-strong: #332b7d;
    --accent-ink: #ffffff;
    --good: #0ca30c;
    --warning: #c98300;
    --serious: #d1652f;
    --critical: #c22f2f;
    --neutral: #6b6878;
    --shadow: 0 1px 2px rgba(27,26,36,0.04), 0 8px 24px -12px rgba(27,26,36,0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #131220; --surface: #1a1830; --surface-2: #242040;
      --border: #35314f; --border-strong: #453f66;
      --ink: #f1eff7; --ink-secondary: #b7b3c9; --ink-muted: #8a86a3;
      --accent: #948bf0; --accent-strong: #b3aaf7; --accent-ink: #171432;
      --good: #3fbf3f; --warning: #f0a63a; --serious: #ef8256; --critical: #ea6363; --neutral: #a29dc0;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -16px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #131220; --surface: #1a1830; --surface-2: #242040;
    --border: #35314f; --border-strong: #453f66;
    --ink: #f1eff7; --ink-secondary: #b7b3c9; --ink-muted: #8a86a3;
    --accent: #948bf0; --accent-strong: #b3aaf7; --accent-ink: #171432;
    --good: #3fbf3f; --warning: #f0a63a; --serious: #ef8256; --critical: #ea6363; --neutral: #a29dc0;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -16px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }

  .app { max-width: 1220px; margin: 0 auto; padding: 24px 24px 64px; }

  /* ---------- Masthead ---------- */
  .masthead { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end;
    padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 40; background: var(--bg); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { width: 46px; height: 46px; border-radius: 50%; flex: none; }
  .brand-text { display: flex; flex-direction: column; }
  .brand-kicker { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px; }
  .masthead h1 { font-family: "Fraunces", Georgia, serif; font-optical-sizing: auto; font-weight: 560; font-size: 30px;
    line-height: 1.05; margin: 0; text-wrap: balance; color: var(--ink); }

  .view-tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 11px; border: 1px solid var(--border); }
  .tab { font-size: 13.5px; font-weight: 600; color: var(--ink-secondary); background: transparent; border: none;
    padding: 9px 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
  .tab .soon-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-muted); }
  .tab .count-pill { font-family: "IBM Plex Mono", monospace; font-size: 11px; background: var(--critical); color: #fff;
    border-radius: 999px; padding: 1px 6px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Toolbar (client + ip-type + actions) ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .toolbar-left { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toolbar-right { display: flex; flex-wrap: wrap; gap: 8px; }

  select.client-select {
    font-family: "Public Sans", sans-serif; font-size: 13.5px; font-weight: 600; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; padding: 9px 30px 9px 12px;
    cursor: pointer; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%235b5868' stroke-width='1.5' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat: no-repeat; background-position: right 11px center;
  }
  .subtabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 9px; border: 1px solid var(--border); }
  .subtab { font-size: 12.5px; font-weight: 600; color: var(--ink-secondary); background: transparent; border: none;
    padding: 7px 13px; border-radius: 7px; cursor: pointer; display:flex; align-items:center; gap:6px; }
  .subtab.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
  .subtab .soon-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-muted); }

  .btn { font-size: 13px; font-weight: 600; border-radius: 9px; padding: 9px 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; white-space: nowrap; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border-strong); }
  .btn-secondary:hover { background: var(--surface-2); }
  .btn-ghost { background: transparent; color: var(--ink-secondary); border: none; padding: 6px 8px; }
  .btn-ghost:hover { color: var(--ink); }
  .btn-danger { background: transparent; color: var(--critical); border: 1px solid var(--critical); }
  .btn-danger:hover { background: color-mix(in oklab, var(--critical) 12%, transparent); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Stats ---------- */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
  .stat-tile .stat-label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }
  .stat-tile .stat-value { font-family: "IBM Plex Mono", monospace; font-size: 28px; font-weight: 600; line-height: 1; color: var(--ink); }
  .stat-tile .stat-foot { margin-top: 8px; font-size: 12.5px; color: var(--ink-secondary); }
  .stat-tile.accent-good .stat-value { color: var(--good); }
  .stat-tile.accent-warn .stat-value { color: var(--critical); }

  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  @media (max-width: 880px) { .workspace { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }

  /* ---------- Ledger controls ---------- */
  .ledger-card { padding: 16px 16px 4px; }
  .ledger-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .search-box { position: relative; flex: 1 1 200px; }
  .search-box input { width: 100%; font-size: 13.5px; padding: 9px 12px 9px 32px; border-radius: 9px;
    border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); }
  .search-box input::placeholder { color: var(--ink-muted); }
  .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; font-weight: 600; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--ink-secondary); cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip .n { font-family: "IBM Plex Mono", monospace; color: var(--ink-muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip[aria-pressed="true"] .n { color: var(--accent-ink); opacity: 0.75; }
  .chip .dot { width:7px; height:7px; border-radius:50%; }
  .result-note { font-size: 12.5px; color: var(--ink-muted); padding: 0 2px 10px; }

  /* ---------- Table ---------- */
  .table-scroll { overflow-x: auto; overflow-y: auto; max-height: 62vh; border-top: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 700px; }
  thead th { position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }
  thead th button:hover { color: var(--ink); }
  thead th .arrow { font-size: 10px; opacity: 0.5; }
  thead th[data-active] button, thead th[data-active] .arrow { color: var(--accent); opacity: 1; }
  tbody tr.row { cursor: pointer; border-bottom: 1px solid var(--border); }
  tbody tr.row:hover { background: var(--surface-2); }
  tbody td { padding: 10px; vertical-align: top; color: var(--ink); }
  td.num { font-family: "IBM Plex Mono", monospace; color: var(--ink-secondary); }
  td.brand-cell .brand-name { font-weight: 600; }
  td.row-actions { display: flex; gap: 2px; white-space: nowrap; }

  select.status-select {
    font-size: 12px; font-weight: 600; border-radius: 999px; padding: 5px 24px 5px 10px; cursor: pointer; appearance: none;
    border: 1px solid var(--border); background-color: var(--surface-2); color: var(--ink);
    background-repeat: no-repeat; background-position: right 8px center;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M1 1l3 3 3-3' stroke='%238a8798' stroke-width='1.4' fill='none'/></svg>");
  }
  select.status-select.tier-good { box-shadow: inset 3px 0 0 var(--good); }
  select.status-select.tier-info { box-shadow: inset 3px 0 0 var(--accent); }
  select.status-select.tier-neutral { box-shadow: inset 3px 0 0 var(--neutral); }
  select.status-select.tier-warning { box-shadow: inset 3px 0 0 var(--warning); }
  select.status-select.tier-serious { box-shadow: inset 3px 0 0 var(--serious); }
  select.status-select.tier-critical { box-shadow: inset 3px 0 0 var(--critical); }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .badge.tier-good .dot { background: var(--good); }
  .badge.tier-info .dot { background: var(--accent); }
  .badge.tier-neutral .dot { background: var(--neutral); }
  .badge.tier-warning .dot { background: var(--warning); }
  .badge.tier-serious .dot { background: var(--serious); }
  .badge.tier-critical .dot { background: var(--critical); }

  tr.detail-row td { background: var(--bg); padding: 4px 10px 16px; border-bottom: 1px solid var(--border); }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 10px 4px 2px; }
  @media (max-width: 640px) { .detail-grid { grid-template-columns: 1fr; } }
  .detail-block h4 { margin: 0 0 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); }
  .detail-block p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-secondary); white-space: pre-line; }
  .detail-block .person-summary-item { margin-bottom: 6px; }
  .detail-block .person-summary-item:last-child { margin-bottom: 0; }
  .detail-block p.person-summary-main { margin: 0; }
  .detail-block p.person-summary-sub { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-muted); }
  .chevron { display:inline-block; transition: transform 0.15s ease; color: var(--ink-muted); }
  tr.row[aria-expanded="true"] .chevron { transform: rotate(90deg); color: var(--accent); }

  /* ---------- Record Audit History / Stage Timeline ---------- */
  .timeline-block { grid-column: 1 / -1; margin-top: 10px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .timeline-block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .timeline-title-wrap { display: flex; align-items: center; gap: 8px; }
  .timeline-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-secondary); }
  .timeline-track { position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 20px; margin-top: 6px; }
  .timeline-track::before { content: ''; position: absolute; left: 6px; top: 12px; bottom: 12px; width: 2px;
    background: var(--border-strong); border-radius: 2px; }
  .timeline-item { position: relative; }
  .timeline-marker { position: absolute; left: -20px; top: 11px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 0 0 2px var(--surface); z-index: 2; }
  .timeline-marker.tier-good { border-color: var(--good); }
  .timeline-marker.tier-warning { border-color: var(--warning); }
  .timeline-marker.tier-serious { border-color: var(--serious); }
  .timeline-marker.tier-critical { border-color: var(--critical); }
  .timeline-marker.tier-neutral { border-color: var(--neutral); }
  .timeline-marker.tier-info { border-color: var(--accent); }
  .timeline-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    box-shadow: var(--shadow); transition: border-color 0.15s ease; }
  .timeline-card:hover { border-color: var(--border-strong); }
  .timeline-card-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .timeline-transition { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .timeline-arrow { color: var(--ink-muted); font-size: 13px; }
  .timeline-meta { font-size: 11.5px; color: var(--ink-muted); display: inline-flex; align-items: center; }
  .timeline-dates { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .timeline-date-chip { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--ink); display: inline-flex; align-items: center; gap: 4px; }
  .timeline-date-chip strong { color: var(--ink-secondary); font-weight: 600; }
  .timeline-date-chip.deadline-chip { background: color-mix(in oklab, var(--warning) 12%, var(--surface));
    border-color: color-mix(in oklab, var(--warning) 30%, var(--border)); color: var(--ink); }
  .timeline-remarks { font-size: 12.5px; line-height: 1.5; color: var(--ink-secondary); background: var(--surface-2);
    border-radius: 7px; padding: 8px 11px; border-left: 3px solid var(--accent); white-space: pre-line; }
  .timeline-empty { padding: 14px 16px; background: var(--surface-2); border: 1px dashed var(--border-strong);
    border-radius: 9px; font-size: 12.5px; color: var(--ink-muted); display: flex; align-items: center; gap: 10px; }

  /* ---------- Stage Transition Modal ---------- */
  .transition-summary-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .transition-stages-flow { display: flex; align-items: center; justify-content: flex-start; gap: 12px; flex-wrap: wrap; }
  .transition-stage-node { display: flex; flex-direction: column; gap: 4px; }
  .transition-stage-sub { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); }
  .transition-arrow-lg { font-size: 16px; color: var(--accent); font-weight: 700; }

  /* ---------- Rail ---------- */
  .rail { display: flex; flex-direction: column; gap: 14px; }
  .rail-card { padding: 16px; }
  .rail-card h3 { font-family: "Fraunces", serif; font-weight: 560; font-size: 16.5px; margin: 0 0 3px; }
  .rail-card .rail-sub { font-size: 12px; color: var(--ink-muted); margin: 0 0 12px; }
  .renewal-item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
  .renewal-item:first-of-type { border-top: none; padding-top: 0; }
  .renewal-item .r-name { font-size: 13px; font-weight: 600; }
  .renewal-item .r-meta { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
  .renewal-item .r-when { text-align: right; flex: none; }
  .renewal-item .r-date { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-secondary); }
  .renewal-item .r-count { font-size: 11px; font-weight: 700; margin-top: 3px; color: var(--accent); }
  .renewal-more { font-size: 12px; color: var(--ink-muted); padding-top: 10px; border-top: 1px solid var(--border); margin-top: 2px; }
  .bar-row { margin-bottom: 11px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .bar-label .bl-name { color: var(--ink-secondary); font-weight: 600; }
  .bar-label .bl-val { font-family: "IBM Plex Mono", monospace; color: var(--ink-muted); }
  .bar-track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }

  /* ---------- Deadlines view ---------- */
  .deadlines-wrap { display: flex; flex-direction: column; gap: 20px; }
  .cta-banner { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 12px;
    background: color-mix(in oklab, var(--warning) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--warning) 40%, var(--border)); }
  .cta-banner strong { color: var(--ink); }
  .cta-banner p { margin: 0; font-size: 13px; color: var(--ink-secondary); flex: 1; }
  .deadline-section h2 { font-family: "Fraunces", serif; font-weight: 560; font-size: 17px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .deadline-section .sec-count { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-muted); font-weight: 500; }
  .deadline-list { display: flex; flex-direction: column; gap: 8px; }
  .deadline-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface);
    border: 1px solid var(--border); box-shadow: var(--shadow); }
  .deadline-item.is-overdue { border-color: color-mix(in oklab, var(--critical) 45%, var(--border)); }
  .deadline-stripe { width: 4px; align-self: stretch; border-radius: 3px; flex: none; }
  .deadline-main { flex: 1; min-width: 0; }
  .deadline-main .d-title { font-weight: 600; font-size: 13.5px; }
  .deadline-main .d-meta { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .deadline-main .d-what { font-size: 12.5px; color: var(--ink-secondary); margin-top: 4px; }
  .client-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--accent);
    background: color-mix(in oklab, var(--accent) 12%, transparent); padding: 2px 7px; border-radius: 5px; }
  .deadline-when { text-align: right; flex: none; }
  .deadline-when .d-date { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; }
  .deadline-when .d-count { font-size: 11.5px; font-weight: 700; margin-top: 2px; }
  .empty-state { padding: 30px; text-align: center; color: var(--ink-muted); font-size: 13.5px; }

  /* ---------- Log ---------- */
  .log-list { display: flex; flex-direction: column; }
  .log-item { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .log-item:last-child { border-bottom: none; }
  .log-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
  .log-body { flex: 1; min-width: 0; }
  .log-summary { font-size: 13.5px; color: var(--ink); }
  .log-time { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; font-family: "IBM Plex Mono", monospace; }

  /* ---------- Coming soon ---------- */
  .soon-wrap { display: flex; align-items: center; justify-content: center; min-height: 320px; }
  .soon-card { text-align: center; max-width: 380px; padding: 40px 32px; }
  .soon-card .soon-icon { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; color: var(--accent); }
  .soon-card h2 { font-family: "Fraunces", serif; font-weight: 560; font-size: 21px; margin: 0 0 8px; }
  .soon-card p { color: var(--ink-secondary); font-size: 13.5px; line-height: 1.55; margin: 0; }

  .panel, .view-panel { display: none; }
  .panel.active, .view-panel.active { display: block; }

  footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-muted);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  /* ---------- Modal ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,14,22,0.5); display: flex; align-items: flex-start;
    justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 100; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 640px; box-shadow: 0 20px 60px -20px rgba(0,0,0,0.4);
    border: 1px solid var(--border); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-family: "Fraunces", serif; font-weight: 560; font-size: 19px; margin: 0; }
  .modal-body { padding: 20px 22px; max-height: 65vh; overflow-y: auto; }
  .modal-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); }
  .modal-footer .right-actions { display: flex; gap: 8px; }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field.span-2 { grid-column: 1 / -1; }
  .field label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-muted); }
  .field .hint { font-size: 11.5px; color: var(--ink-muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .field input, .field select, .field textarea {
    font-family: inherit; font-size: 13.5px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--bg); color: var(--ink); width: 100%;
  }
  .field textarea { resize: vertical; min-height: 64px; font-family: "Public Sans", sans-serif; }
  .field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--critical); }
  .field .error-msg { font-size: 11.5px; color: var(--critical); font-weight: 600; }
  .field.auto-filled label::after { content: "auto-filled — check"; margin-left: 6px; font-size: 10px; font-weight: 600;
    text-transform: none; letter-spacing: 0; color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, transparent);
    padding: 1px 6px; border-radius: 5px; }

  /* ---------- Applicant / Author cards ---------- */
  .person-cards { display: flex; flex-direction: column; gap: 10px; }
  .person-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px 12px 4px; background: var(--bg); }
  .person-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .person-card-head .person-card-title { font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); }
  .person-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  @media (max-width: 560px) { .person-field-grid { grid-template-columns: 1fr; } }
  div.person-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  div.person-field.span-2 { grid-column: 1 / -1; }
  div.person-field label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-muted); }
  div.person-field input, div.person-field select, div.person-field textarea {
    font-family: inherit; font-size: 12.5px; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--ink); width: 100%;
  }
  div.person-field textarea { resize: vertical; min-height: 44px; font-family: "Public Sans", sans-serif; }

  /* ---------- Logo / device-mark upload ---------- */
  .logo-field-row { display: flex; gap: 8px; align-items: center; }
  .field .logo-field-row input.logo-url-input { flex: 1 1 auto; width: auto; min-width: 0; }
  .logo-upload-btn { flex: none; }
  img.logo-preview { display: block; margin-top: 10px; width: 64px; height: 64px; border-radius: 8px; object-fit: cover;
    border: 1px solid var(--border); background: var(--surface); }
  img.brand-thumb { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; margin-right: 6px; vertical-align: middle; }
  img.detail-logo-img { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }

  /* ---------- Client Dashboard ---------- */
  button.stat-tile-clickable { appearance: none; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  button.stat-tile-clickable:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .stat-tile .stat-link { color: var(--accent); font-weight: 700; }

  .parse-banner { background: color-mix(in oklab, var(--warning) 12%, var(--surface)); border: 1px solid color-mix(in oklab, var(--warning) 35%, var(--border));
    border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 12.5px; color: var(--ink-secondary); }
  .parse-banner strong { color: var(--ink); display: block; margin-bottom: 4px; font-size: 13px; }
  .parse-banner.ok { background: color-mix(in oklab, var(--good) 12%, var(--surface)); border-color: color-mix(in oklab, var(--good) 35%, var(--border)); }

  .format-guide { margin-top: 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
  .format-guide summary { cursor: pointer; padding: 10px 13px; font-size: 12.5px; font-weight: 600; color: var(--accent); list-style: none; }
  .format-guide summary::-webkit-details-marker { display: none; }
  .format-guide summary::before { content: "▸ "; }
  .format-guide[open] summary::before { content: "▾ "; }
  .format-guide pre { margin: 0; padding: 0 13px 13px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    color: var(--ink-secondary); white-space: pre-wrap; }

  textarea.chat-input { width: 100%; min-height: 160px; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; line-height: 1.55;
    padding: 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); }

  .readonly-banner { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 10px; margin-bottom: 16px;
    background: color-mix(in oklab, var(--neutral) 14%, var(--surface)); border: 1px solid var(--border); font-size: 12.5px; color: var(--ink-secondary); }

  .toast-stack { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
  .toast { background: var(--ink); color: var(--bg); font-size: 13px; padding: 10px 16px; border-radius: 9px; box-shadow: var(--shadow);
    max-width: 320px; }
  :root:not([data-theme="light"]) .toast, :root[data-theme="dark"] .toast { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border-strong); }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Search field select ---------- */
  .search-controls { display: flex; gap: 8px; flex: 1 1 260px; min-width: 0; }
  .search-controls .search-box { flex: 1 1 auto; }
  select.search-field-select {
    font-family: "Public Sans", sans-serif; font-size: 12.5px; font-weight: 600; color: var(--ink-secondary);
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; padding: 9px 26px 9px 11px;
    cursor: pointer; appearance: none; flex: none; max-width: 168px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%235b5868' stroke-width='1.5' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center;
  }

  /* ---------- Pager ---------- */
  .pager { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 14px 2px 6px; }
  .pager button { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; min-width: 28px; height: 28px;
    padding: 0 8px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--ink-secondary); cursor: pointer; }
  .pager button:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
  .pager button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager-ellipsis { color: var(--ink-muted); font-size: 12px; padding: 0 2px; }
  .pager-note { margin-left: auto; font-size: 12px; color: var(--ink-muted); }

  /* ---------- Password reveal ---------- */
  /* .gate-card input and .field input are equal-specificity generic rules that set a padding
     shorthand and could clobber this field's right-side padding depending on source order —
     qualify with the input's own class (two classes) so this always wins regardless of order. */
  .password-field { position: relative; }
  .password-field input.pw-input { width: 100%; padding-right: 38px; }
  button.pw-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: transparent;
    border: none; padding: 6px; border-radius: 7px; color: var(--ink-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  button.pw-toggle:hover { color: var(--ink); background: var(--surface-2); }

  /* ---------- Checklists (export columns) ---------- */
  .check-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 7px 16px;
    max-height: 220px; overflow-y: auto; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
  label.check-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 400; text-transform: none; letter-spacing: normal; color: var(--ink-secondary); cursor: pointer; }
  .check-item input { accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
  label.radio-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: normal; color: var(--ink-secondary); cursor: pointer; margin-bottom: 8px; }
  .radio-row input { margin-top: 3px; accent-color: var(--accent); flex: none; width: 15px; height: 15px; }
  .export-meta { font-size: 12px; color: var(--ink-muted); }
  textarea.export-fallback { width: 100%; min-height: 160px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    padding: 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); margin-top: 10px; }

  /* ---------- Settings ---------- */
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .settings-card { padding: 20px 22px; }
  .settings-card h3 { font-family: "Fraunces", serif; font-weight: 560; font-size: 17px; margin: 0 0 8px; }
  .settings-desc { font-size: 12.5px; line-height: 1.55; color: var(--ink-secondary); margin: 0 0 14px; }
  .settings-note { font-size: 12px; color: var(--ink-muted); margin: 8px 0 0; }
  .settings-status { font-size: 12.5px; color: var(--ink-secondary); margin: 0 0 12px; }
  .radio-stack { display: flex; flex-direction: column; gap: 8px; }
  .radio-tile { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    cursor: pointer; font-size: 13px; }
  .radio-tile:hover { background: var(--surface-2); }
  .radio-tile.active { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--surface)); }
  .radio-tile input { margin-top: 3px; accent-color: var(--accent); }
  .radio-tile small { display: block; color: var(--ink-muted); font-size: 11.5px; margin-top: 2px; font-weight: 400; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; cursor: pointer; }
  .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .switch-track { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; transition: background 0.15s ease; pointer-events: none; }
  .switch-track::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%;
    transition: transform 0.15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .switch input:checked + .switch-track { background: var(--accent); }
  .switch input:checked + .switch-track::before { transform: translateX(16px); }

  /* ---------- Login gate ---------- */
  body.gated .app, body.gated #modal-root, body.gated .toast-stack { filter: blur(10px); pointer-events: none; user-select: none; }
  .gate-overlay { position: fixed; inset: 0; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
  .gate-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 24px 70px -20px rgba(0,0,0,0.35);
    padding: 34px 32px; max-width: 340px; width: 100%; text-align: center; }
  .gate-card .brand-logo { width: 52px; height: 52px; margin-bottom: 14px; border-radius: 50%; }
  .gate-card h2 { font-family: "Fraunces", serif; font-weight: 560; font-size: 21px; margin: 0 0 6px; }
  .gate-card p { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
  .gate-card input { width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border-strong);
    background: var(--bg); color: var(--ink); margin-bottom: 12px; text-align: center; }
  .gate-error { color: var(--critical) !important; font-weight: 600; font-size: 12.5px !important; }
  .gate-hint { font-size: 11.5px !important; color: var(--ink-muted) !important; margin-top: 14px !important; }

  /* ---------- Shared-backend connect prompt (non-blocking, unlike the gate) ---------- */
  .backend-prompt-overlay { position: fixed; left: 20px; bottom: 20px; z-index: 150; max-width: 340px; width: calc(100% - 40px); }
  .backend-prompt-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.4); padding: 18px 20px; }
  .backend-prompt-card h3 { font-family: "Fraunces", serif; font-weight: 560; font-size: 15.5px; margin: 0 22px 6px 0; }
  .backend-prompt-card p { font-size: 12.5px; color: var(--ink-secondary); margin: 0 0 12px; line-height: 1.45; }
  .backend-prompt-close { position: absolute; top: 12px; right: 14px; background: none; border: none; cursor: pointer;
    color: var(--ink-muted); font-size: 13px; line-height: 1; padding: 2px; }
  /* ---------- Statutory Renewal Engine & Badges ---------- */
  .renewal-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 6px; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; }
  .renewal-badge.phase-active { background: color-mix(in oklab, var(--good) 14%, var(--surface)); color: var(--good); border: 1px solid color-mix(in oklab, var(--good) 30%, transparent); }
  .renewal-badge.phase-upcoming { background: color-mix(in oklab, var(--warning) 14%, var(--surface)); color: var(--warning); border: 1px solid color-mix(in oklab, var(--warning) 35%, transparent); }
  .renewal-badge.phase-grace { background: color-mix(in oklab, var(--serious) 15%, var(--surface)); color: var(--serious); border: 1px solid color-mix(in oklab, var(--serious) 35%, transparent); }
  .renewal-badge.phase-restoration { background: color-mix(in oklab, var(--critical) 15%, var(--surface)); color: var(--critical); border: 1px solid color-mix(in oklab, var(--critical) 35%, transparent); }
  .renewal-badge.phase-lapsed { background: var(--surface-2); color: var(--ink-muted); border: 1px solid var(--border-strong); }
  .renewal-badge.phase-max-term { background: color-mix(in oklab, var(--accent) 15%, var(--surface)); color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent); }
  .renewal-badge.phase-public-domain { background: var(--surface-2); color: var(--critical); border: 1px solid color-mix(in oklab, var(--critical) 30%, transparent); }

  .renewal-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .renewal-date-val { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 600; color: var(--ink); }

  /* Statutory Engine Callout Banner */
  .statutory-callout { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 13px 16px;
    margin-bottom: 14px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .statutory-callout-info { display: flex; flex-direction: column; gap: 4px; }
  .statutory-callout-title { font-size: 13.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .statutory-callout-sub { font-size: 12px; color: var(--ink-secondary); line-height: 1.4; }
  .statutory-callout-meta { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-muted); }

  /* Statutory Dates Section in Modal */
  .statutory-dates-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .statutory-card-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .renewal-engine-preview { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.4; }
  .renewal-engine-hint { font-size: 11.5px; color: var(--ink-muted); margin-top: 6px; font-style: italic; }

  /* ---------- Miscellaneous Filings & Timeline Layout ---------- */
  .timeline-section-wrap { display: flex; flex-direction: column; gap: 12px; }
  .timeline-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .timeline-mode-toggle { display: flex; gap: 2px; background: var(--surface-2); padding: 2px; border-radius: 7px; border: 1px solid var(--border); }
  .timeline-mode-btn { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 5px; border: none; background: transparent; color: var(--ink-secondary); cursor: pointer; }
  .timeline-mode-btn.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }

  .timeline-dual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 880px) { .timeline-dual-grid { grid-template-columns: 1fr; } }

  .misc-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
  .misc-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .misc-panel-title { font-size: 13.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .misc-count-badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--ink-secondary); padding: 1px 7px; border-radius: 999px; }
  .misc-empty { padding: 18px 16px; background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 9px;
    font-size: 12px; color: var(--ink-muted); text-align: center; line-height: 1.5; }
  .misc-list { display: flex; flex-direction: column; gap: 10px; }
  .misc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px;
    border-left: 3px solid var(--accent); box-shadow: var(--shadow); transition: border-color 0.15s ease; }
  .misc-card:hover { border-color: var(--border-strong); border-left-color: var(--accent-strong); }
  .misc-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .form-pill { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; padding: 2px 7px;
    border-radius: 5px; background: color-mix(in oklab, var(--accent) 12%, var(--surface)); color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 28%, transparent); }
  .cbr-tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px;
    background: var(--surface-2); color: var(--ink-secondary); border: 1px solid var(--border); }
  .misc-purpose { font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; line-height: 1.4; }
  .misc-notes { font-size: 12px; color: var(--ink-secondary); margin-bottom: 6px; line-height: 1.4; white-space: pre-line; background: var(--surface-2); padding: 6px 9px; border-radius: 6px; }
  .misc-card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--ink-muted); flex-wrap: wrap; gap: 6px; }
  .misc-card-actions { display: flex; gap: 6px; }

  /* Unified timeline misc styling */
  .timeline-item.is-misc .timeline-marker { border-color: #7c3aed; background: var(--surface); border-width: 3px; }
  .timeline-item.is-misc .timeline-card { border-left: 3px solid #7c3aed; }

  /* Misc Form Modal */
  .quick-forms-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .quick-form-btn { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border-strong); color: var(--ink); cursor: pointer; }
  .quick-form-btn:hover { background: var(--surface-2); border-color: var(--accent); }
  .quick-form-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  function addYearsSafe(iso, years) {
    if (!iso) return null;
    var s = String(iso).trim().slice(0, 10);
    var parts = s.split('-');
    if (parts.length < 3) return null;
    var y = parseInt(parts[0], 10) + years;
    var m = parseInt(parts[1], 10);
    var d = parseInt(parts[2], 10);
    if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
    // Leap year check: if Feb 29 and destination year is not leap, clamp to Feb 28
    if (m === 2 && d === 29) {
      var isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
      if (!isLeap) d = 28;
    }
    var mm = m < 10 ? '0' + m : '' + m;
    var dd = d < 10 ? '0' + d : '' + d;
    return y + '-' + mm + '-' + dd;
  }

  function addMonthsSafe(iso, months) {
    if (!iso) return null;
    var s = String(iso).trim().slice(0, 10);
    var parts = s.split('-');
    if (parts.length < 3) return null;
    var y = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10) + months;
    var d = parseInt(parts[2], 10);
    if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
    while (m > 12) { y++; m -= 12; }
    while (m < 1) { y--; m += 12; }
    var maxDays = new Date(Date.UTC(y, m, 0)).getUTCDate();
    if (d > maxDays) d = maxDays;
    var mm = m < 10 ? '0' + m : '' + m;
    var dd = d < 10 ? '0' + d : '' + d;
    return y + '-' + mm + '-' + dd;
  }

  function calculateRenewalDetails(r) {
    if (!r) return null;
    var ipType = r.ipType || 'trademark';
    if (ipType !== 'trademark' && ipType !== 'design') return null;
    var today = todayIso();

    if (ipType === 'trademark') {
      // Statutory preference (Section 23(1) & 25(1)):
      // If renewed previously: lastRenewalDate is base.
      // Else: priorityDate > filingDate > registrationDate > legacy renewDate
      var baseDate = null;
      var isRenewalCycle = false;
      if (r.lastRenewalDate) {
        baseDate = r.lastRenewalDate;
        isRenewalCycle = true;
      } else if (r.priorityDate) {
        baseDate = r.priorityDate;
      } else if (r.filingDate) {
        baseDate = r.filingDate;
      } else if (r.registrationDate) {
        baseDate = r.registrationDate;
      } else if (r.renewDate) {
        return evaluateTrademarkPhases(r.renewDate, today, r, null, false);
      } else {
        return null;
      }

      var nextRenewalDate = addYearsSafe(baseDate, 10);
      return evaluateTrademarkPhases(nextRenewalDate, today, r, baseDate, isRenewalCycle);
    }

    if (ipType === 'design') {
      // Indian Designs Act, 2000 (Section 5(6), 11 & 12):
      // Priority Date > Filing Date > Registration Date
      var baseDate = r.priorityDate || r.filingDate || r.registrationDate;
      if (!baseDate && r.renewDate) {

      }
      if (!baseDate) return null;

      var isExtended = !!r.designExtended;

      if (isExtended) {

  async function attemptUnlock() {
    var input = document.getElementById('gate-input');
    if (!input) return;
    var pass = input.value.trim();
    if (!pass) {
      renderGate('Please enter your passphrase or access key.');
      return;
    }

    if (backendConfigured) {
      var res = await fetchBackendState(pass);
      if (res.configured && res.authorized) {
        sessionApiKey = pass;
        sessionUnlocked = true;
        sessionStorage.setItem('lextria-session-unlocked', 'yes');
        backendAuthorized = true;
        PERSIST_TIER = 'backend';
        if (res.state) state = normalizeState(res.state);
        if (!shouldLockOnRefresh()) {
          setLocalPref(LEXTRIA_API_KEY_STORAGE, pass);
          setLocalPref(LOCAL_KEYS.unlocked, 'yes');
        }
        renderGate();
        renderAll();
        toast('Unlocked — connected to shared database.');
        return;
      } else {
        renderGate('Incorrect access key / passphrase — try again.');
        return;
      }
    }

    if (state.settings && state.settings.loginEnabled && state.settings.loginHash) {
      var hash = await sha256Hex(pass);
      if (hash === state.settings.loginHash) {
        sessionUnlocked = true;
        sessionStorage.setItem('lextria-session-unlocked', 'yes');
        if (!shouldLockOnRefresh()) {
          setLocalPref(LOCAL_KEYS.unlocked, 'yes');
        }
        renderGate();
        renderAll();
        toast('Unlocked.');
        return;
      } else {
        renderGate('Incorrect passphrase — try again.');
        return;
      }
    }

    sessionUnlocked = true;
    renderGate();
    renderAll();
  }
  function lockNow() {
    sessionUnlocked = false;
    sessionApiKey = '';
    sessionStorage.removeItem('lextria-session-unlocked');
    setLocalPref(LOCAL_KEYS.unlocked, '');
    renderGate();
    renderAll();
    toast('Dashboard locked.');
  }
  function setLoginPassphrase(newPass) {
    sha256Hex(newPass).then(function (hash) {
      var newState = JSON.parse(JSON.stringify(state));
      newState.settings = newState.settings || {};
      newState.settings.loginHash = hash;
      newState.settings.loginEnabled = true;
      pushLog(newState, (state.settings.loginEnabled ? 'Updated' : 'Turned on') + ' the ledger login passphrase');
      setLocalPref(LOCAL_KEYS.unlocked, 'yes');
      persist(newState, 'Passphrase saved');
    });
  }
  function disableLogin() {
    var newState = JSON.parse(JSON.stringify(state));
    newState.settings = newState.settings || {};
    newState.settings.loginEnabled = false;
    pushLog(newState, 'Turned off the ledger login passphrase');
    persist(newState, 'Login turned off');
  }
  function submitLoginSave() {
    if (!settingsDraft.newPass || settingsDraft.newPass.length < 4) {
      settingsDraft.error = 'Use at least 4 characters.';
      renderAll();
      return;
    }
    if (settingsDraft.newPass !== settingsDraft.confirmPass) {
      settingsDraft.error = 'Passphrases don\'t match.';
      renderAll();
      return;
    }
    setLoginPassphrase(settingsDraft.newPass);
    settingsDraft = { editingLogin: false, newPass: '', confirmPass: '', error: '' };
  }

  /* ===================== Deadline notifications (this device only) ===================== */
  function maybeNotifyDeadlines() {
    if (getLocalPref(LOCAL_KEYS.notify, 'off') !== 'on') return;
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    var today = todayIso();
    if (getLocalPref(LOCAL_KEYS.notifiedDate, '') === today) return;
    setLocalPref(LOCAL_KEYS.notifiedDate, today);
    var urgent = computeDeadlines('__all__').filter(function (d) { return daysUntil(d.date) <= 45; });
    if (!urgent.length) return;
    try {
      new Notification('Lextria IP Ledger', {
        body: urgent.length + ' filing' + (urgent.length === 1 ? '' : 's') + ' due within 45 days. Soonest: ' +
          urgent[0].record.brand + ' — ' + fmtDate(urgent[0].date) + '.',
        tag: 'lextria-deadlines'
      });
    } catch (e) { /* some hosts restrict Notification even when "granted" — fail quietly */ }
  }
  function handleNotifyToggle(checked) {
    if (!checked) { setLocalPref(LOCAL_KEYS.notify, 'off'); renderAll(); return; }
    if (typeof Notification === 'undefined') {
      toast('Desktop notifications aren\'t available in this preview window.');
      renderAll();
      return;
    }
    if (Notification.permission === 'granted') {
      setLocalPref(LOCAL_KEYS.notify, 'on');
      toast('Desktop alerts turned on.');
      renderAll();
      setLocalPref(LOCAL_KEYS.notifiedDate, '');
      maybeNotifyDeadlines();
      return;
    }
    if (Notification.permission === 'denied') {
      toast('Notifications are blocked for this page in your browser\'s settings.');
      renderAll();
      return;
    }
    Notification.requestPermission().then(function (perm) {
      if (perm === 'granted') {
        setLocalPref(LOCAL_KEYS.notify, 'on');
        toast('Desktop alerts turned on.');
        setLocalPref(LOCAL_KEYS.notifiedDate, '');
        maybeNotifyDeadlines();
      } else {
        toast('Notifications need your browser\'s permission — allow them and try again.');
      }
      renderAll();
    });
  }

  /* ===================== Persistence ===================== */
  function buildFullDocument(newState) {
    var titleHtml = '<title>' + escapeHtml(document.title) + '</title>';
    var fontLinkTags = Array.prototype.map.call(document.querySelectorAll('link'), function (l) { return l.outerHTML; }).join('\n');
    var styleHtml = '<style id="app-style">' + document.getElementById('app-style').textContent + '</style>';
    var scriptSrc = document.getElementById('app-script').textContent;
    var stateJson = JSON.stringify(newState).replace(/</g, '<');
    return '<!doctype html>\n<html>\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      titleHtml + '\n' + fontLinkTags + '\n' + styleHtml + '\n</head>\n<body>\n' +
      '<div class="app" id="app-root"></div>\n<div id="modal-root"></div>\n<div id="gate-root"></div>\n<div id="backend-key-root"></div>\n<div id="toast-root" class="toast-stack"></div>\n' +
      '<script id="app-state" type="application/json">' + stateJson + '<' + '/script>\n' +
      '<script id="app-script">' + scriptSrc + '<' + '/script>\n</body>\n</html>';
  }

  function persist(newState, successMsg) {
    // Optimistic update: the UI reflects the change immediately, for every tier —
    // a failed remote save reports itself via toast rather than reverting silently
    // or looking like it worked.
    state = newState;
    renderAll();

    if (PERSIST_TIER === 'claude') {
      if (!artifactApi) {
        toast((successMsg || 'Saved') + ' — local preview only (open from claude.ai to sync with your team)');
        return;
      }
      artifactApi.publish(buildFullDocument(state)).then(function () {
        // successful publish reloads this view automatically
      }, function (err) {
        if (err && (err.code === 'not_writer' || err.code === 'not_granted')) {
          isReadOnly = true;
          toast('This ledger is read-only for your account.');
          renderAll();
        } else if (err && err.code === 'conflict') {
          toast('Someone else just updated the ledger — reloading…');
        } else {
          toast('Could not save — please try again.');
        }
      });
      return;
    }

    if (PERSIST_TIER === 'backend') {
      fetch('/api/state', { method: 'PUT', headers: apiAuthHeaders(), body: JSON.stringify(state) })
        .then(function (res) {
          if (res.status === 401 || res.status === 403) {
            backendAuthorized = false;
            toast('Could not save — the shared backend rejected this browser\'s access key.');
            return;
          }
          if (!res.ok) {
            toast('Could not save to the shared database — please try again.');
          }
        })
        .catch(function () {
          toast('Could not save to the shared database — check your connection and try again.');
        });
      return;
    }

    // Local-only tier.
    try {
      localStorage.setItem(LEXTRIA_STATE_KEY, JSON.stringify(state));
    } catch (e) {
      toast('Could not save — this browser\'s storage may be full or in private-browsing mode.');
    }
  }

  /* ===================== Derived data ===================== */
  function recordsFor(clientId, ipType) {
    return state.records.filter(function (r) {
      return r.ipType === ipType && (!clientId || clientId === '__all__' || r.clientId === clientId);
    });
  }
  function computeDeadlines(clientFilter, ipTypeFilter) {
    var items = [];
    state.records.forEach(function (r) {
      if (ipTypeFilter && r.ipType !== ipTypeFilter) return;
      if (clientFilter && clientFilter !== '__all__' && r.clientId !== clientFilter) return;
      var client = clientById(r.clientId);
      if (r.actionDate) {
        items.push({ record: r, client: client, kind: 'action', label: r.action || statusDef(r.status).suggestedAction || 'Action required', date: r.actionDate });
      }
      var ren = calculateRenewalDetails(r);
      if (ren && ren.nextRenewalDate) {
        var days = ren.daysLeft;
        // Show in deadlines if upcoming, in grace period, in restoration window, or within 365 days
        var isUrgentOrDue = (ren.phase === 'upcoming' || ren.phase === 'grace' || ren.phase === 'restoration' || (days >= 0 && days <= 365));
        if (isUrgentOrDue) {
          var renLabel = 'File renewal';
          if (r.ipType === 'design') {
            if (ren.phase === 'restoration') renLabel = 'Restoration window (Sec. 12 / Form-4)';
            else if (ren.phase === 'upcoming') renLabel = 'File Form-3 (5-year extension)';
            else renLabel = 'Design 10-year renewal';
          } else {
            if (ren.phase === 'grace') renLabel = 'Renewal (Grace period + surcharge)';
            else if (ren.phase === 'restoration') renLabel = 'Restoration & Renewal (Form TM-R)';
            else renLabel = 'File renewal (Form TM-R)';
          }
          items.push({
            record: r,
            client: client,
            kind: 'renewal',
            label: renLabel,
            date: ren.nextRenewalDate,
            phase: ren.phase,
            tier: ren.tier
          });
        }
      } else if (r.renewDate) {
        items.push({ record: r, client: client, kind: 'renewal', label: 'File renewal', date: r.renewDate });
      }
    });
    items.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    return items;
  }
  // "Needs a deadline" = matters sitting in an at-risk status (tier warning/serious — e.g. trademark's
  // Objected/Opposed) with no action date logged yet. Tier-based so it generalizes across ipTypes.
  function computeNeedsDeadline(clientFilter, ipTypeFilter) {
    return state.records.filter(function (r) {
      if (ipTypeFilter && r.ipType !== ipTypeFilter) return false;
      if (clientFilter && clientFilter !== '__all__' && r.clientId !== clientFilter) return false;
      var tier = statusDef(r.status).tier;
      return (tier === 'warning' || tier === 'serious') && !r.actionDate;
    });
  }

  /* ===================== Rendering: shell ===================== */
  function renderAll() {
    document.getElementById('app-root').innerHTML = renderApp();
  }

  function renderApp() {
    var html = '';
    html += renderMasthead();
    if (isReadOnly) {
      html += '<div class="readonly-banner">👁 You have read-only access to this ledger. Changes you make here won\'t be saved.</div>';
    }
    html += '<main>';
    html += '<div class="view-panel' + (view.mode === 'clientDashboard' ? ' active' : '') + '" id="view-clientdashboard">' + renderClientDashboardView() + '</div>';
    html += '<div class="view-panel' + (view.mode === 'ledger' ? ' active' : '') + '" id="view-ledger">' + renderLedgerView() + '</div>';

  function renderFooter() {
    return '<footer><span>' + state.clients.length + ' client' + (state.clients.length === 1 ? '' : 's') + ' &middot; ' +
      state.records.length + ' matters tracked</span><span>Lextria IP Dashboard</span>' +
      '<span>Saving to: ' + escapeHtml(tierLabel()) + '</span></footer>';
  }

  /* ===================== Client Dashboard view ===================== */
  function renderClientDashboardView() {
    if (view.dashboardClientId && view.dashboardClientId !== '__all__' && !clientById(view.dashboardClientId)) {
      view.dashboardClientId = '__all__';
    }
    var cid = view.dashboardClientId || '__all__';
    var html = '<div class="toolbar" style="margin-bottom:18px;"><div class="toolbar-left">';
    html += '<select class="client-select" data-action="dashboard-change-client">';
    html += '<option value="__all__"' + (cid === '__all__' ? ' selected' : '') + '>All Clients</option>';
    state.clients.forEach(function (c) {
      html += '<option value="' + escapeHtml(c.id) + '"' + (c.id === cid ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
    });
    html += '</select></div></div>';

    html += '<div class="stats-row">';
    ['trademark', 'copyright', 'design'].forEach(function (t) {
      var tcfg = ipConfig(t);
      var n = recordsFor(cid, t).length;
      html += '<button type="button" class="stat-tile stat-tile-clickable" data-action="dashboard-goto" data-iptype="' + t + '">' +
        '<div class="stat-label">' + escapeHtml(tcfg.label) + 's</div>' +
        '<div class="stat-value">' + n + '</div>' +
        '<div class="stat-foot stat-link">View ledger &rarr;</div>' +
        '</button>';
    });
    html += '</div>';
    return html;
  }

  /* ===================== Ledger view ===================== */
  function renderLedgerView() {
    if (view.clientId && view.clientId !== '__all__' && !clientById(view.clientId)) {
      view.clientId = '__all__';
    }
    var cid = view.clientId || '__all__';
    var cfg = ipConfig(view.ipType);
    var html = '<div class="toolbar">';
    html += '<div class="toolbar-left">';
    html += '<select class="client-select" data-action="change-client">';
    html += '<option value="__all__"' + (cid === '__all__' ? ' selected' : '') + '>All ' + cfg.label + 's</option>';
    state.clients.forEach(function (c) {
      html += '<option value="' + escapeHtml(c.id) + '"' + (c.id === cid ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>';
    });
    html += '<option value="__new__">+ Add client&hellip;</option>';
    html += '</select>';
    html += '<div class="subtabs">';
    ['trademark', 'copyright', 'design'].forEach(function (t) {
      var label = ipConfig(t).label;
      html += '<button class="subtab' + (view.ipType === t ? ' active' : '') + '" data-action="set-iptype" data-iptype="' + t + '">' + label + '</button>';
    });
    html += '</div></div>';
    html += '<div class="toolbar-right">';
    html += '<button class="btn btn-secondary" data-action="open-export"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0-4 4m4-4 4 4M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/></svg>Export</button>';
    if (!isReadOnly) {
      html += '<button class="btn btn-secondary" data-action="open-import"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Import</button>';
      html += '<button class="btn btn-primary" data-action="open-add"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>' + escapeHtml(cfg.addLabel) + '</button>';
    }
    html += '</div></div>';

    var clientRecords = recordsFor(cid, view.ipType);
    html += renderStats(clientRecords, view.ipType);
    html += '<div class="workspace">';
    html += renderLedgerTable(clientRecords, view.ipType);
    html += renderLedgerRail(clientRecords, view.ipType);
    html += '</div>';
    return html;
  }

  // Buckets generalize by status tier (rather than hardcoded status keys) so the same logic works
  // across trademark/copyright/design. For trademark this reproduces the exact previous counts:
  // registered==tier good, queued (filed/formalities-pass)==tier neutral, needs-attention
  // (objected/opposed/refused)==tier warning|serious|critical.
  function renderStats(records, ipType) {
    var total = records.length;
    var registered = records.filter(function (r) { return statusDef(r.status).tier === 'good'; }).length;
    var queued = records.filter(function (r) { return statusDef(r.status).tier === 'neutral'; }).length;
    var attention = records.filter(function (r) {
      var t = statusDef(r.status).tier;
      return t === 'warning' || t === 'serious' || t === 'critical';
    }).length;
    function tile(label, value, foot, tone) {
      return '<div class="stat-tile' + (tone ? ' ' + tone : '') + '"><div class="stat-label">' + label + '</div>' +
        '<div class="stat-value">' + value + '</div>' + (foot ? '<div class="stat-foot">' + foot + '</div>' : '') + '</div>';
    }
    var scopeLabel = view.clientId === '__all__' ? 'Across all clients' : 'For this client';
    return '<div class="stats-row">' +
      tile('Total applications', total, total ? scopeLabel : 'No matters yet') +
      tile('Registered &amp; secured', registered, total ? Math.round(registered / total * 100) + '% of portfolio' : '', 'accent-good') +
      tile('In examination queue', queued, 'Filed or formalities passed') +
      tile('Needs attention', attention, 'Objected, opposed or refused', attention > 0 ? 'accent-warn' : '') +
      '</div>';
  }

  function matchesSearch(r, q, field, showClient) {
    if (!q) return true;
    q = q.toLowerCase();
    if (field && field !== 'all') {
      var fd = null;
      SEARCH_FIELDS.forEach(function (f) { if (f.key === field) fd = f; });
      if (!fd) return true;
      return (fd.get(r) || '').toString().toLowerCase().indexOf(q) !== -1;
    }
    var hay = SEARCH_FIELDS.filter(function (f) { return !f.clientOnly || showClient; })
      .map(function (f) { return f.get(r); }).join(' ');
    return hay.toLowerCase().indexOf(q) !== -1;
  }
  function cmpRecords(a, b, key, dir) {
    var av = a[key], bv = b[key];
    if (key === 'client') {
      var ca = clientById(a.clientId), cb = clientById(b.clientId);
      av = ca ? ca.name : ''; bv = cb ? cb.name : '';
    }
    if (key === 'renewDate') { av = av || '9999-99-99'; bv = bv || '9999-99-99'; }
    if (av === null || av === undefined) av = '';
    if (bv === null || bv === undefined) bv = '';
    return String(av).localeCompare(String(bv), undefined, { numeric: true }) * dir;
  }

  function renderLedgerTable(allRecords, ipType) {
    var cfg = ipConfig(ipType);
    var showClient = view.clientId === '__all__';
    var searchFields = computeSearchFields(allRecords, showClient, ipType);
    if (view.searchField !== 'all' && !searchFields.some(function (f) { return f.key === view.searchField; })) {
      view.searchField = 'all';
    }
    var activeStatuses = Object.keys(view.statusFilter).filter(function (k) { return view.statusFilter[k]; });
    var rows = allRecords.filter(function (r) {
      if (activeStatuses.length && activeStatuses.indexOf(r.status) === -1) return false;
      return matchesSearch(r, view.search, view.searchField, showClient);
    }).sort(function (a, b) { return cmpRecords(a, b, view.sortKey, view.sortDir); });

    var pageInfo = paginate(rows, view.ledgerPage, getPageSize());
    view.ledgerPage = pageInfo.page;
    var pageRows = pageInfo.pageItems;

    var html = '<div class="card ledger-card">';
    html += '<div class="ledger-controls">';
    html += '<div class="search-controls">';
    html += '<div class="search-box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      '<input type="text" data-action="search" placeholder="' + escapeHtml(cfg.searchPlaceholder) + '" value="' + escapeHtml(view.search) + '"></div>';
    html += '<select class="search-field-select" data-action="search-field" title="Search a specific field">';
    html += '<option value="all"' + (view.searchField === 'all' ? ' selected' : '') + '>All fields</option>';
    searchFields.forEach(function (f) {
      html += '<option value="' + f.key + '"' + (view.searchField === f.key ? ' selected' : '') + '>' + escapeHtml(searchFieldLabel(f, cfg)) + '</option>';
    });
    html += '</select>';
    html += '</div>';
    html += '<div class="chip-row">';
    var counts = {};
    allRecords.forEach(function (r) { counts[r.status] = (counts[r.status] || 0) + 1; });
    html += '<button class="chip" data-action="clear-status-filter" aria-pressed="' + (activeStatuses.length === 0 ? 'true' : 'false') + '">All <span class="n">' + allRecords.length + '</span></button>';
    statusDefsForType(ipType).forEach(function (s) {
      var n = counts[s.key] || 0;
      if (!n) return;
      html += '<button class="chip" data-action="toggle-status-filter" data-status="' + s.key + '" aria-pressed="' + (view.statusFilter[s.key] ? 'true' : 'false') + '">' +

      if (!n) return;
      html += '<div class="bar-row"><div class="bar-label"><span class="bl-name">' + s.label + '</span><span class="bl-val">' + n + '</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + (n / max * 100) + '%; background:var(' + TIER_VAR[s.tier] + ')"></div></div></div>';
    });
    html += '</div></aside>';
    return html;
  }

  /* ===================== Deadlines view ===================== */
  function renderDeadlinesView() {
    var needs = computeNeedsDeadline(view.deadlineClientFilter);
    var items = computeDeadlines(view.deadlineClientFilter);
    var overdue = items.filter(function (i) { return daysUntil(i.date) < 0; });
    var soon = items.filter(function (i) { var d = daysUntil(i.date); return d >= 0 && d <= 45; });
    var upcoming = items.filter(function (i) { return daysUntil(i.date) > 45; });

    var html = '<div class="deadlines-wrap">';
    html += '<div class="chip-row">';
    html += '<button class="chip" data-action="set-deadline-client" data-client="__all__" aria-pressed="' + (view.deadlineClientFilter === '__all__') + '">All clients</button>';
    state.clients.forEach(function (c) {
      html += '<button class="chip" data-action="set-deadline-client" data-client="' + escapeHtml(c.id) + '" aria-pressed="' + (view.deadlineClientFilter === c.id) + '">' + escapeHtml(c.name.split(' ')[0]) + '</button>';
    });
    html += '</div>';

    if (needs.length) {
      html += '<div class="cta-banner"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;color:var(--warning)"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>' +
        '<p><strong>' + needs.length + ' matter' + (needs.length === 1 ? '' : 's') + '</strong> ' + (needs.length === 1 ? 'is' : 'are') + ' objected or opposed with no deadline logged yet. Add a date so it shows up here.</p>' +
        '<button class="btn btn-secondary" data-action="scroll-needs">Review</button></div>';
    }

    html += renderDeadlineSection('Overdue', overdue, 'overdue');
    html += renderDeadlineSection('Due within 45 days', soon, 'soon');
    // Overdue/Soon stay fully visible (short worklists by design) — only Upcoming is paginated,
    // since it is the bucket most likely to grow long once all three ipTypes are mixed together.
    html += renderDeadlineSection('Upcoming', upcoming, 'upcoming', 'deadlines-upcoming');

    if (needs.length) {
      html += '<div class="deadline-section" id="needs-deadline-section"><h2>Needs a deadline added <span class="sec-count">' + needs.length + '</span></h2><div class="deadline-list">';
      needs.forEach(function (r) {
        var client = clientById(r.clientId);
        var sd = statusDef(r.status);
        var rcfg = ipConfig(r.ipType);
        html += '<div class="deadline-item"><div class="deadline-stripe" style="background:var(' + TIER_VAR[sd.tier] + ')"></div>' +
          '<div class="deadline-main"><div class="d-title"><span class="client-tag">' + escapeHtml(client ? client.name.split(' ')[0] : '') + '</span> ' +
          '<span class="client-tag" style="color:var(--ink-secondary);background:var(--surface-2);">' + escapeHtml(rcfg.label) + '</span> ' + escapeHtml(r.brand) + '</div>' +
          '<div class="d-meta">' + escapeHtml(rcfg.clsLabel) + ' ' + (r.cls || '—') + ' &middot; ' + escapeHtml(r.appno) + ' &middot; ' + sd.label + '</div></div>' +
          '<button class="btn btn-secondary" data-action="open-edit" data-id="' + r.id + '">Add deadline</button></div>';
      });
      html += '</div></div>';
    }

    if (!items.length && !needs.length) {
      html += '<div class="empty-state">No deadlines logged yet. Add applications with renewal or action dates to see them here.</div>';
    }
    html += '</div>';
    return html;
  }

  function renderDeadlineSection(title, items, tone, pagerScope) {
    if (!items.length) return '';
    var list = items, pageInfo = null;
    if (pagerScope) {
      pageInfo = paginate(items, view[pagerPageKey(pagerScope)], getPageSize());
      view[pagerPageKey(pagerScope)] = pageInfo.page;
      list = pageInfo.pageItems;
    }
    var html = '<div class="deadline-section"><h2>' + title + ' <span class="sec-count">' + items.length + '</span></h2><div class="deadline-list">';
    list.forEach(function (dl) {
      var sd = statusDef(dl.record.status);
      var rcfg = ipConfig(dl.record.ipType);
      var days = daysUntil(dl.date);
      var isOverdue = days < 0;
      html += '<div class="deadline-item' + (isOverdue ? ' is-overdue' : '') + '">' +
        '<div class="deadline-stripe" style="background:var(' + (isOverdue ? '--critical' : TIER_VAR[sd.tier]) + ')"></div>' +
        '<div class="deadline-main"><div class="d-title"><span class="client-tag">' + escapeHtml(dl.client ? dl.client.name.split(' ')[0] : '') + '</span> ' +
        '<span class="client-tag" style="color:var(--ink-secondary);background:var(--surface-2);">' + escapeHtml(rcfg.label) + '</span> ' + escapeHtml(dl.record.brand) + '</div>' +
        '<div class="d-meta">' + escapeHtml(rcfg.clsLabel) + ' ' + (dl.record.cls || '—') + ' &middot; ' + escapeHtml(dl.record.appno) + ' &middot; ' + sd.label + '</div>' +
        '<div class="d-what">' + (dl.kind === 'renewal' ? 'Renewal due' : escapeHtml(dl.label)) + '</div></div>' +
        '<div class="deadline-when"><div class="d-date">' + fmtDate(dl.date) + '</div><div class="d-count" style="color:var(' + (isOverdue ? '--critical' : '--accent') + ')">' + humanCountdown(days) + '</div></div>' +
        '<button class="btn-ghost" data-action="open-edit" data-id="' + dl.record.id + '" title="Open"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>' +
        '</div>';
    });
    html += '</div>';
    if (pagerScope) html += renderPager(pagerScope, pageInfo);
    html += '</div>';
    return html;
  }

  /* ===================== Log view ===================== */
  function relativeTime(iso) {
    var d = new Date(iso);
    var diffMin = Math.round((Date.now() - d.getTime()) / 60000);
    if (diffMin < 1) return 'just now';
    if (diffMin < 60) return diffMin + 'm ago';
    var diffH = Math.round(diffMin / 60);
    if (diffH < 24) return diffH + 'h ago';
    var diffD = Math.round(diffH / 24);
    if (diffD < 30) return diffD + 'd ago';
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function absoluteTime(iso) {
    var d = new Date(iso);
    return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function renderLogView() {
    var entries = (state.log || []);
    var html = '<div class="card rail-card" style="padding:8px 4px;">';
    if (!entries.length) {
      html += '<div class="empty-state">No changes logged yet. Every add, edit, status change and import will show up here.</div>';
    } else {
      var pageInfo = paginate(entries, view.logPage, getPageSize());
      view.logPage = pageInfo.page;
      html += '<div class="log-list">';
      pageInfo.pageItems.forEach(function (e) {
        html += '<div class="log-item"><div class="log-dot"></div><div class="log-body"><div class="log-summary">' + escapeHtml(e.summary) + '</div>' +
          '<div class="log-time" title="' + escapeHtml(absoluteTime(e.ts)) + '">' + escapeHtml(relativeTime(e.ts)) + '</div></div></div>';
      });
      html += '</div>';
      html += renderPager('log', pageInfo);
    }
    html += '</div>';
    return html;
  }

  function openStageTransitionModal(record, newStatus) {

      mode: 'stage-transition',

      newStatus: newStatus,
      effectiveDate: todayIso(),
      deadline: calculateSuggestedDeadline(record.ipType, newStatus),

  function openMiscFormModal(recordId, filingIdToEdit, prefillFormCode) {
    var r = recordById(recordId);

    modalState = {
      mode: 'misc-form',
      recordId: recordId,
      filingId: filing ? filing.id : null,
      draft: filing ? JSON.parse(JSON.stringify(filing)) : {
        formNumber: defaultForm,
        filingDate: todayIso(),
        purpose: prefillFormCode === 'TM-R' ? 'Statutory Renewal of Trade Mark' : (prefillFormCode === 'Form-3' ? 'Application for extension of copyright in registered design (5 years)' : ''),

        notes: ''

      autoUpdateRenewal: true,
      errors: {}

    renderModal();

    modalState = null;
    renderModal();

  function renderModal() {
    var root = document.getElementById('modal-root');
    if (!modalState) { root.innerHTML = ''; return; }
    if (modalState.mode === 'import') {

      root.innerHTML = renderExportModal();
    } else if (modalState.mode === 'stage-transition') {
      root.innerHTML = renderStageTransitionModal();

      root.innerHTML = renderMiscFormModal();
